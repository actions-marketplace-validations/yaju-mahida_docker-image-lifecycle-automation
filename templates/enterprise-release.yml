# Copy to .github/workflows/image-lifecycle.yml for approval-gated,
# multi-platform OCI releases. Configure DEPLOYMENT_ENVIRONMENT with required
# reviewers and use OIDC for cloud registries where available.
name: Governed Container Release Lifecycle

on:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Compute lifecycle decisions without changing external state'
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  monitor:
    if: ${{ github.event_name != 'push' }}
    uses: yaju-mahida/docker-image-lifecycle/.github/workflows/reusable-base-image-monitor.yml@v1
    with:
      dockerfile-path: ${{ vars.DOCKERFILE_PATH || 'Dockerfile' }}
      update-policy: ${{ vars.BASE_IMAGE_UPDATE_POLICY || 'DIGEST_AND_VERSION' }}
      update-strategy: ${{ vars.BASE_IMAGE_UPDATE_STRATEGY || 'patch' }}
      pr-reviewers: ${{ vars.REPOSITORY_REVIEWERS }}
      pr-assignees: ${{ vars.REPOSITORY_ASSIGNEES }}
      dry-run: ${{ inputs.dry-run || false }}
    secrets: inherit

  release:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    uses: yaju-mahida/docker-image-lifecycle/.github/workflows/reusable-docker-release.yml@v1
    with:
      var-dockerfile: ${{ vars.DOCKERFILE_PATH }}
      var-build-context: ${{ vars.BUILD_CONTEXT }}
      var-platforms: ${{ vars.BUILD_PLATFORMS || 'linux/amd64,linux/arm64' }}
      var-test-command: ${{ vars.TEST_COMMAND }}
      var-environment: ${{ vars.DEPLOYMENT_ENVIRONMENT || 'production' }}
      var-scan-severity-threshold: ${{ vars.SCAN_SEVERITY_THRESHOLD || 'CRITICAL,HIGH' }}
      var-release-tag-strategy: ${{ vars.RELEASE_TAG_STRATEGY || 'SEMVER_INCREMENT' }}
      var-release-semver-bump: ${{ vars.RELEASE_SEMVER_BUMP || 'patch' }}
      var-sign-images: 'true'
      var-publish-ghcr: ${{ vars.PUBLISH_GHCR }}
      var-ghcr-image: ${{ vars.GHCR_IMAGE }}
      var-publish-ecr: ${{ vars.PUBLISH_ECR }}
      var-ecr-image: ${{ vars.ECR_IMAGE }}
      var-aws-region: ${{ vars.AWS_REGION }}
      dry-run: ${{ inputs.dry-run || false }}
    secrets: inherit
