# ==============================================================================
# Docker Image Lifecycle Automation - Optional Repository Configuration File
# Copy to .github/docker-automation.yml in consuming repositories.
#
# Precedence:
# 1. Caller workflow_call "with:" inputs
# 2. Repository Variables (Settings > Secrets and variables > Actions > Variables)
# 3. This configuration file (.github/docker-automation.yml)
# 4. Built-in defaults
# ==============================================================================

monitor:
  # Repo Var: BASE_IMAGE_MONITOR_ENABLED / DOCKER_MONITOR_ENABLED (Default: true)
  enabled: true

  # Repo Var: BASE_IMAGE_UPDATE_POLICY (Default: DIGEST_AND_VERSION)
  # Options: DIGEST_AND_VERSION | DIGEST_ONLY | VERSION_ONLY | STRICT_SEMVER | ALWAYS_UPDATE
  update_policy: DIGEST_AND_VERSION

  # Repo Var: BASE_IMAGE_UPDATE_STRATEGY / DOCKER_UPDATE_STRATEGY (Default: patch)
  # Options: patch | minor | major
  update_strategy: patch

  # Repo Var: AUTO_CREATE_UPDATE_PR / DOCKER_AUTO_CREATE_PR (Default: true)
  auto_create_pr: true

  # Repo Var: AUTO_MERGE_UPDATE_PR / DOCKER_AUTO_MERGE (Default: false)
  auto_merge: false

  # Repo Var: PR_REVIEWERS / REPOSITORY_REVIEWERS (comma-separated or YAML list)
  reviewers:
    - platform-team

  # Repo Var: PR_ASSIGNEES / REPOSITORY_ASSIGNEES (comma-separated or YAML list)
  assignees:
    - application-owner

release:
  # Repo Var: RELEASE_BRANCHES (Default: main)
  branches:
    - main

  # Repo Var: PATHS_IGNORE (JSON array string in vars, or YAML list here)
  paths_ignore:
    - '*.md'
    - 'docs/**'

  # Repo Var: DOCKERFILE_PATH (Default: Dockerfile)
  dockerfile: Dockerfile

  # Repo Var: BUILD_CONTEXT (Default: .)
  build_context: .

  # Repo Var: BUILD_PLATFORMS (Default: linux/amd64)
  platforms: linux/amd64,linux/arm64

  # Repo Var: TEST_COMMAND (Default: "")
  test_command: 'docker run --rm candidate-image:test true'

  # Repo Var: DEPLOYMENT_ENVIRONMENT (Default: production)
  environment: production

  # Repo Var: SCAN_SEVERITY_THRESHOLD (Default: CRITICAL,HIGH)
  scan_severity_threshold: 'CRITICAL,HIGH'

  # Repo Var: RELEASE_TAG_STRATEGY (Default: BASE_TAG_INCREMENT)
  # Options: BASE_TAG_INCREMENT | UPSTREAM_TAG | PREFIX_INCREMENT |
  #          RELEASE_INCREMENT | SEMVER_INCREMENT | DATE_INCREMENT | DIGEST
  tag_strategy: BASE_TAG_INCREMENT

  # Repo Var: RELEASE_PREFIX (Used by PREFIX_INCREMENT and DATE_INCREMENT)
  prefix: 'app'

  # Repo Var: RELEASE_INCREMENT_BASENAME (Used by RELEASE_INCREMENT, default: release)
  increment_basename: 'release'

  # Repo Var: RELEASE_SEMVER_INITIAL (Used by SEMVER_INCREMENT, default: v1.0.0)
  semver_initial: 'v1.0.0'

  # Repo Var: RELEASE_SEMVER_BUMP (Used by SEMVER_INCREMENT, default: patch)
  semver_bump: 'patch'

  # Repo Var: PUBLISH_UPSTREAM_TAG_ALIAS (Default: false)
  publish_upstream_tag_alias: false

  # Repo Var: SIGN_IMAGES (Default: false - keyless Cosign + GitHub OIDC)
  sign_images: false

  # ----------------------------------------------------------------------
  # PUBLISH TARGETS - Repository Variables (recommended, NOT this file)
  # ----------------------------------------------------------------------
  # The single-instance-per-registry-type case is driven entirely by
  # Repository Variables, NOT by keys in this YAML file. Set a `PUBLISH_
  # <TYPE>=true` variable plus its matching `<TYPE>_IMAGE` (and, for some
  # providers, a registry host/region companion variable) and the reusable
  # release workflow publishes to it - no config file entry needed. These
  # are listed here purely as a documentation/quick-start reference; they
  # take precedence over any matching `type:` entry in the `registries:`
  # array below, which is skipped automatically to avoid duplicates.
  #
  #   PUBLISH_GHCR=true            GHCR_IMAGE=ghcr.io/org/app
  #   PUBLISH_DOCKERHUB=true       DOCKERHUB_IMAGE=org/app
  #   PUBLISH_ACR=true             ACR_IMAGE=myregistry.azurecr.io/app
  #   PUBLISH_ECR=true             ECR_IMAGE=123456789012.dkr.ecr.us-east-1.amazonaws.com/app
  #                                 AWS_REGION=us-east-1
  #   PUBLISH_QUAY=true            QUAY_IMAGE=quay.io/org/app
  #   PUBLISH_HARBOR=true          HARBOR_IMAGE=harbor.example.com/project/app
  #                                 HARBOR_REGISTRY_HOST=harbor.example.com
  #   PUBLISH_ARTIFACTORY=true     ARTIFACTORY_IMAGE=yourco.jfrog.io/docker-local/app
  #                                 ARTIFACTORY_REGISTRY_HOST=yourco.jfrog.io
  #   PUBLISH_GITLAB=true          GITLAB_IMAGE=registry.gitlab.com/group/project
  #                                 GITLAB_REGISTRY_HOST=registry.gitlab.com
  #   PUBLISH_DIGITALOCEAN=true    DIGITALOCEAN_IMAGE=registry.digitalocean.com/reg/app
  #   PUBLISH_OCIR=true            OCIR_IMAGE=iad.ocir.io/tenancy/app
  #                                 OCIR_REGISTRY_HOST=iad.ocir.io
  #   PUBLISH_PRIVATE=true         PRIVATE_IMAGE=registry.example.com/app
  #                                 PRIVATE_REGISTRY_HOST=registry.example.com
  #
  #   IMAGE_NAME=org/app  # shared fallback image path for any PUBLISH_<TYPE>=true
  #                       # registry left without its own <TYPE>_IMAGE variable.
  #
  # Multi-registry / advanced targets (config-file-only escape hatch):
  # use this array ONLY for cases a scalar Repository Variable cannot
  # express, e.g. a second instance of the same registry type (two ACR
  # regions, region-sharded ECR) or a registry type/host worth keeping in
  # reviewable YAML rather than the repository Settings UI.
  registries:
    - type: ghcr
      image: 'ghcr.io/${GITHUB_REPOSITORY}'
    - type: dockerhub
      image: '${DOCKER_HUB_REGISTRY}/${IMAGE_NAME}'
    - type: acr
      registry: 'myregistry.azurecr.io'
      image: 'myregistry.azurecr.io/app'
    - type: ecr
      image: '123456789012.dkr.ecr.us-east-1.amazonaws.com/app'
      region: 'us-east-1'
    - type: quay
      image: 'quay.io/my-org/app'
    - type: harbor
      registry: 'harbor.example.com'
      image: 'harbor.example.com/project/app'
    - type: artifactory
      registry: 'yourco.jfrog.io'
      image: 'yourco.jfrog.io/docker-local/app'
    - type: gitlab
      registry: 'registry.gitlab.com'
      image: 'registry.gitlab.com/your-group/your-project'
    - type: digitalocean
      image: 'registry.digitalocean.com/your-registry/app'
    - type: ocir
      registry: 'iad.ocir.io'
      image: 'iad.ocir.io/your-tenancy/app'
    - type: private
      registry: 'registry.example.com'
      image: 'registry.example.com/app'
