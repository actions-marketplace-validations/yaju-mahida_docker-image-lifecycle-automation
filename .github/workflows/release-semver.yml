name: Release (SemVer)

# PLATFORM RELEASE WORKFLOW (SEMANTIC VERSIONING)
#
# This workflow automates versioning and releases for the
# docker-image-lifecycle-automation platform itself (GitHub Action,
# reusable workflows, and composite actions).
#
# On every push to `main` or manual run:
#
# 1. Identifies the latest semantic version tag (vX.Y.Z).
#    - If no previous release exists, the first release is always v1.0.0.
#
# 2. Determines the next version.
#
#    Automatic mode (`bump=auto`) uses Conventional Commit messages:
#
#      Commit Type / Pattern                Result
#      -------------------------------      -------
#      feat!:                               Major
#      fix!:                                Major
#      BREAKING CHANGE: footer              Major
#      feat:                                Minor
#      fix:                                 Patch
#      perf:                                Patch
#      revert:                              Patch
#      docs:                                No release
#      chore:                               No release
#      ci:                                  No release
#      test:                                No release
#      refactor:                            No release
#
#    Notes:
#    - The highest bump level found wins:
#        major > minor > patch
#    - Examples:
#        fix + feat                -> Minor release
#        fix + feat!               -> Major release
#        docs + chore + test       -> No release
#
# 3. Manual execution can override commit classification:
#    - bump=patch  -> Force patch release
#    - bump=minor  -> Force minor release
#    - bump=major  -> Force major release
#    - bump=auto   -> Use Conventional Commit analysis
#
# 4. Skips release creation when:
#    - No qualifying commits exist since the last release.
#    - The latest commit message contains `[skip release]`.
#
# 5. Generates categorized release notes from all commits included
#    in the calculated release range.
#
# 6. Creates a GitHub Release and semantic version tag using the
#    GitHub Releases API against the already-reviewed commit on `main`.
#
# 7. Updates the moving major-version tag (for example `v1`) so
#    consumers using:
#
#         uses: owner/repository@v1
#
#    automatically receive the latest compatible release within
#    that major version.
#
# 8. Prepends release notes to CHANGELOG.md and opens a pull request
#    with the changelog update because direct pushes to the protected
#    `main` branch are not permitted.
#
# Dry-run mode:
#   - Calculates the next version.
#   - Generates release notes.
#   - Does not create releases, update tags, or open a changelog PR.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Force a bump instead of classifying commit messages'
        type: choice
        options: ['auto', 'patch', 'minor', 'major']
        default: 'auto'
      dry-run:
        description: 'Compute the next version and print it without releasing'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-semver-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Calculate Version and Publish Release
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine next SemVer release
        id: version
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FORCE_BUMP: ${{ inputs.bump || 'auto' }}
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet

          fail() {
            echo "::error::$1"
            exit 1
          }

          LAST_TAG="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1 || true)"
          if [ -n "$LAST_TAG" ]; then
            RANGE="${LAST_TAG}..HEAD"
            [[ "$LAST_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || fail "Latest tag '$LAST_TAG' is not valid SemVer."
            MAJOR="${BASH_REMATCH[1]}"; MINOR="${BASH_REMATCH[2]}"; PATCH="${BASH_REMATCH[3]}"
          else
            RANGE="HEAD"
            MAJOR=0; MINOR=0; PATCH=0
          fi

          COMMIT_COUNT="$(git rev-list --count "$RANGE" 2>/dev/null || echo 0)"
          if [ "$COMMIT_COUNT" -eq 0 ] && [ -n "$LAST_TAG" ]; then
            echo "::notice::No commits since $LAST_TAG; nothing to release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # No prior release exists: the platform's first published version
          # is always v1.0.0, regardless of commit classification, so
          # consumers never see a v0.x.y release.
          if [ -z "$LAST_TAG" ]; then
            NEW_TAG="v1.0.0"
            MAJOR_TAG="v1"

            if gh release view "$NEW_TAG" >/dev/null 2>&1; then
              fail "Release $NEW_TAG already exists."
            fi

            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "bump=initial" >> "$GITHUB_OUTPUT"
            echo "previous_tag=" >> "$GITHUB_OUTPUT"
            echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
            echo "major_tag=$MAJOR_TAG" >> "$GITHUB_OUTPUT"
            echo "range=$RANGE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Conventional Commit classification. Merge commit subjects are
          # included so squash-merged PR titles (the common case) are seen;
          # bodies are also scanned for a "BREAKING CHANGE:" footer.
          #
          # Regexes are held in variables: bash's [[ ]] tokenizer mis-parses
          # an inline regex containing ')' inside a bracket expression.
          RE_BREAKING='^[a-zA-Z]+(\([^)]*\))?!:'
          RE_FEAT='^feat(\([^)]*\))?:'
          RE_PATCH='^(fix|perf|revert)(\([^)]*\))?:'

          BUMP="none"
          if [ "$FORCE_BUMP" != "auto" ]; then
            BUMP="$FORCE_BUMP"
          else
            while IFS= read -r subject; do
              if [[ "$subject" =~ $RE_BREAKING ]]; then
                BUMP="major"; break
              elif [[ "$subject" =~ $RE_FEAT ]] && [ "$BUMP" != "major" ]; then
                BUMP="minor"
              elif [[ "$subject" =~ $RE_PATCH ]] && [ "$BUMP" = "none" ]; then
                BUMP="patch"
              fi
            done < <(git log --no-merges --pretty=format:'%s' "$RANGE")

            if git log --pretty=format:'%B' "$RANGE" | grep -qE '^BREAKING CHANGE:'; then
              BUMP="major"
            fi
          fi

          if [ "$BUMP" = "none" ]; then
            echo "::notice::No feat/fix/perf/revert/breaking commits since ${LAST_TAG:-the initial commit}; skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
            *) fail "Unsupported bump '$BUMP'." ;;
          esac

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          MAJOR_TAG="v${MAJOR}"

          if gh release view "$NEW_TAG" >/dev/null 2>&1; then
            fail "Release $NEW_TAG already exists."
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$LAST_TAG" >> "$GITHUB_OUTPUT"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "major_tag=$MAJOR_TAG" >> "$GITHUB_OUTPUT"
          echo "range=$RANGE" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        if: ${{ steps.version.outputs.should_release == 'true' }}
        shell: bash
        env:
          RANGE: ${{ steps.version.outputs.range }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
          NEW_TAG: ${{ steps.version.outputs.new_tag }}
        run: |
          set -euo pipefail

          # Classify each commit exactly once, using the same rules as the
          # version bump. `git log --grep` is deliberately not used: it
          # matches anywhere in the commit message, which both misfiles
          # commits and lists them under several headings at once.
          : > breaking.txt; : > features.txt; : > fixes.txt
          : > perf.txt; : > reverts.txt; : > other.txt

          # Regexes are held in variables: bash's [[ ]] tokenizer mis-parses
          # an inline regex containing ')' inside a bracket expression.
          RE_BREAKING='^[a-zA-Z]+(\([^)]*\))?!:'
          RE_FEAT='^feat(\([^)]*\))?:'
          RE_FIX='^fix(\([^)]*\))?:'
          RE_PERF='^perf(\([^)]*\))?:'
          RE_REVERT='^revert(\([^)]*\))?:'

          while IFS= read -r -d '' record; do
            # git separates log entries with a newline, so every record
            # after the first arrives with a leading newline.
            record="${record#$'\n'}"
            [ -n "$record" ] || continue
            sha="${record%%$'\n'*}"
            rest="${record#*$'\n'}"
            subject="${rest%%$'\n'*}"
            body="${rest#*$'\n'}"
            line="- ${subject} (${sha})"

            if [[ "$subject" =~ $RE_BREAKING ]] || printf '%s' "$body" | grep -qE '^BREAKING CHANGE:'; then
              printf '%s\n' "$line" >> breaking.txt
            elif [[ "$subject" =~ $RE_FEAT ]]; then
              printf '%s\n' "$line" >> features.txt
            elif [[ "$subject" =~ $RE_FIX ]]; then
              printf '%s\n' "$line" >> fixes.txt
            elif [[ "$subject" =~ $RE_PERF ]]; then
              printf '%s\n' "$line" >> perf.txt
            elif [[ "$subject" =~ $RE_REVERT ]]; then
              printf '%s\n' "$line" >> reverts.txt
            else
              printf '%s\n' "$line" >> other.txt
            fi
          done < <(git log --no-merges --pretty=format:'%h%n%s%n%b%x00' "$RANGE")

          group() {
            local file="$1" heading="$2"
            if [ -s "$file" ]; then
              printf '### %s\n\n' "$heading"
              cat "$file"
              printf '\n'
            fi
            return 0
          }

          {
            printf '## %s\n\n' "$NEW_TAG"
            group breaking.txt '⚠ Breaking Changes'
            group features.txt 'Features'
            group fixes.txt 'Fixes'
            group perf.txt 'Performance'
            group reverts.txt 'Reverts'
            group other.txt 'Other changes'
            if [ -n "$PREVIOUS_TAG" ]; then
              printf '\n**Full Changelog:** %s/compare/%s...%s\n' \
                "${{ github.server_url }}/${{ github.repository }}" "$PREVIOUS_TAG" "$NEW_TAG"
            fi
          } > release_notes.md

          rm -f breaking.txt features.txt fixes.txt perf.txt reverts.txt other.txt
          cat release_notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create release and move major tag
        if: ${{ steps.version.outputs.should_release == 'true' && !inputs.dry-run }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ steps.version.outputs.new_tag }}
          MAJOR_TAG: ${{ steps.version.outputs.major_tag }}
        run: |
          set -euo pipefail

          # Created via the Releases API against an already-merged (and
          # already branch-protection-verified) commit SHA, so this does
          # not require a locally signed `git push` of the new tag.
          gh release create "$NEW_TAG" \
            --title "$NEW_TAG" \
            --notes-file release_notes.md \
            --target "${{ github.sha }}" \
            --latest

          REPO="${{ github.repository }}"
          # The "get a reference" endpoint prefix-matches ambiguous tag
          # names (e.g. a lookup for "v1" can resolve against "v1.0.0" or
          # "v1.1.0"), so it cannot be used to test for the *exact*
          # existence of the moving major tag - doing so previously caused
          # this step to wrongly attempt a PATCH against a ref that does
          # not exist, failing with HTTP 422. `git ls-remote` performs an
          # exact ref-name match instead.
          if git ls-remote --exit-code --tags origin "refs/tags/${MAJOR_TAG}" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${REPO}/git/refs/tags/${MAJOR_TAG}" \
              -f sha="${{ github.sha }}" -F force=true
          else
            gh api --method POST "repos/${REPO}/git/refs" \
              -f ref="refs/tags/${MAJOR_TAG}" -f sha="${{ github.sha }}"
          fi

          echo "### Released ${NEW_TAG} (moved ${MAJOR_TAG})" >> "$GITHUB_STEP_SUMMARY"

      - name: Dry-run summary
        if: ${{ steps.version.outputs.should_release == 'true' && inputs.dry-run }}
        shell: bash
        run: |
          echo "::notice::Dry run - would release ${{ steps.version.outputs.new_tag }} (bump: ${{ steps.version.outputs.bump }}) and move ${{ steps.version.outputs.major_tag }}."

      - name: Update CHANGELOG.md
        if: ${{ steps.version.outputs.should_release == 'true' && !inputs.dry-run }}
        shell: bash
        run: |
          set -euo pipefail
          touch CHANGELOG.md
          if [ ! -s CHANGELOG.md ]; then
            printf '# Changelog\n\n' > CHANGELOG.md
          fi
          {
            head -n 2 CHANGELOG.md
            echo
            cat release_notes.md
            echo
            tail -n +3 CHANGELOG.md
          } > CHANGELOG.md.tmp
          mv CHANGELOG.md.tmp CHANGELOG.md

      # `main` is protected (PR-only, verified signatures), so this token
      # cannot push the changelog update directly - open a PR instead and
      # let it merge through the normal review/signature process.
      - name: Open changelog pull request
        if: ${{ steps.version.outputs.should_release == 'true' && !inputs.dry-run }}
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs(changelog): add ${{ steps.version.outputs.new_tag }} release notes"
          branch: "automation/changelog-${{ steps.version.outputs.new_tag }}"
          delete-branch: true
          title: "docs(changelog): ${{ steps.version.outputs.new_tag }} release notes"
          body: |
            Automated changelog update for release
            [`${{ steps.version.outputs.new_tag }}`](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.version.outputs.new_tag }}).

            This PR only updates `CHANGELOG.md`; the release itself was
            already published by the `release-semver` workflow.
          labels: documentation,automated
          add-paths: CHANGELOG.md
