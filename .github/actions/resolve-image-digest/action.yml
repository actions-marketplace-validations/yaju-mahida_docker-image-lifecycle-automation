name: 'Resolve Image Digest'
description: >
  Resolves a tag to its immutable content digest against any OCI Distribution
  Spec compliant registry (Docker Hub, GHCR, ACR, ECR, Quay, Harbor,
  Artifactory, GitLab, Oracle, generic and private OCI registries).

  Registry authentication is discovered from the registry's own
  WWW-Authenticate challenge rather than hardcoded per registry, so no
  registry-specific code is required. Credentials are optional; public
  images resolve anonymously.

  The manifest Accept header set is fixed and prefers the multi-arch index,
  because a registry returns a DIFFERENT digest depending on what the client
  advertises. Keeping this set stable is what makes digest comparison
  reliable rather than a source of phantom changes.

inputs:
  registry:
    description: 'Registry host (e.g. docker.io, ghcr.io, myreg.azurecr.io)'
    required: true
  repository:
    description: 'Repository path (e.g. library/wordpress, org/app)'
    required: true
  tag:
    description: 'Tag to resolve to a digest'
    required: true
  username:
    description: 'Optional registry username for private/rate-limited pulls'
    required: false
    default: ''
  password:
    description: 'Optional registry password or token'
    required: false
    default: ''
  verify-stability:
    description: >
      Resolve twice and require both reads to agree before reporting a
      digest. Protects against CDN/replica skew causing false positives.
    required: false
    default: 'true'

outputs:
  digest:
    description: 'Resolved manifest digest, empty when resolution failed'
    value: ${{ steps.resolve.outputs.digest }}
  resolved:
    description: '"true" when a stable digest was resolved'
    value: ${{ steps.resolve.outputs.resolved }}
  media_type:
    description: 'Manifest media type (index vs single manifest)'
    value: ${{ steps.resolve.outputs.media_type }}
  is_multi_arch:
    description: '"true" when the tag resolves to a multi-arch index'
    value: ${{ steps.resolve.outputs.is_multi_arch }}
  platforms:
    description: 'Comma-separated os/arch list for multi-arch images'
    value: ${{ steps.resolve.outputs.platforms }}

runs:
  using: 'composite'
  steps:
    - id: resolve
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        REPOSITORY: ${{ inputs.repository }}
        TAG: ${{ inputs.tag }}
        REGISTRY_USERNAME: ${{ inputs.username }}
        REGISTRY_PASSWORD: ${{ inputs.password }}
        VERIFY_STABILITY: ${{ inputs.verify-stability }}
      # Delegates to the shared implementation at the repository root so
      # the root Marketplace action and this internal action can never
      # drift apart. github.action_path is this action's directory.
      run: bash "${{ github.action_path }}/../../../scripts/resolve-image-digest.sh"
