name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-yaml:
    name: Validate Action Metadata and Workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse YAML files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          from pathlib import Path
          import yaml

          paths = [
              Path('action.yml'),
              *Path('.github').rglob('*.yml'),
              *Path('examples').glob('*.yml'),
              *Path('templates').glob('*.yml'),
              *Path('test-fixtures').rglob('*.yml'),
          ]
          for path in paths:
              yaml.safe_load(path.read_text(encoding='utf-8'))
              print(f'Validated {path}')
          PYEOF
      - name: Validate Marketplace metadata
        shell: bash
        run: |
          set -euo pipefail
          test -f action.yml
          grep -q '^name:' action.yml
          grep -q '^description:' action.yml
          grep -q '^runs:' action.yml
          grep -q '^branding:' action.yml
      - name: Validate hybrid distribution contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          from pathlib import Path
          import re
          import yaml

          repository = 'yaju-mahida/docker-image-lifecycle-automation'
          workflow_inputs = {}
          for workflow_path in Path('.github/workflows').glob('reusable-*.yml'):
              workflow = yaml.safe_load(workflow_path.read_text(encoding='utf-8'))
              triggers = workflow.get('on', workflow.get(True, {}))
              workflow_inputs[workflow_path.name] = set(
                  triggers['workflow_call'].get('inputs', {})
              )

          for template_path in Path('templates').glob('*.yml'):
              template = yaml.safe_load(template_path.read_text(encoding='utf-8'))
              for job_name, job in template.get('jobs', {}).items():
                  reference = job.get('uses', '')
                  match = re.fullmatch(
                      rf'{re.escape(repository)}/.github/workflows/(reusable-[\w-]+\.yml)@v1',
                      reference,
                  )
                  if not match:
                      continue
                  workflow_name = match.group(1)
                  unsupported = set(job.get('with', {})) - workflow_inputs[workflow_name]
                  if unsupported:
                      raise SystemExit(
                          f'{template_path}:{job_name} passes unsupported inputs to '
                          f'{workflow_name}: {sorted(unsupported)}'
                      )
                  print(f'Validated {template_path}:{job_name} -> {workflow_name}')

          for action_path in Path('.github/actions').glob('*/action.yml'):
              action = yaml.safe_load(action_path.read_text(encoding='utf-8'))
              if action.get('runs', {}).get('using') != 'composite':
                  raise SystemExit(f'{action_path} must be a composite action')
              print(f'Validated composite action {action_path}')
          PYEOF
      - name: Validate shared scripts
        shell: bash
        run: |
          set -euo pipefail
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - name: Run deterministic action fixtures
        shell: bash
        run: python3 tests/run-fixtures.py

  smoke-test-root-action:
    name: Resolve Public OCI Digest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: digest
        uses: ./
        with:
          registry: docker.io
          repository: library/alpine
          tag: '3.20'
      - name: Assert digest output
        shell: bash
        env:
          RESOLVED: ${{ steps.digest.outputs.resolved }}
          DIGEST: ${{ steps.digest.outputs.digest }}
          IS_MULTI_ARCH: ${{ steps.digest.outputs.is_multi_arch }}
          PLATFORMS: ${{ steps.digest.outputs.platforms }}
        run: |
          set -euo pipefail
          test "$RESOLVED" = 'true'
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          test "$IS_MULTI_ARCH" = 'true'
          grep -qxF 'linux/amd64' <<< "$(tr ',' '\n' <<< "$PLATFORMS")"
          grep -qxF 'linux/arm64' <<< "$(tr ',' '\n' <<< "$PLATFORMS")"