# Sample Consumer Workflow — Repository-Variable-First Onboarding
#
# Copy this file into a repository that owns a Dockerfile
# (e.g. `.github/workflows/release.yml`) to onboard onto the shared Docker
# image lifecycle pipeline. Replace `your-org/docker-image-lifecycle@v1`
# with the actual lifecycle platform repository and the version you want to pin to.
#
# RECOMMENDED ONBOARDING PATH: set Repository Variables under
# Settings > Secrets and variables > Actions > Variables, and Repository
# Secrets for any registry credentials you need. Most repositories need NO
# .github/docker-automation.yml file at all. See docs/REUSABLE_AUTOMATION.md
# "Repository Variables Catalog" for the full list and
# docs/docker-automation.yml.example only if you need the advanced,
# multi-instance registry escape hatch.
#
# HOW SCHEDULING WORKS: GitHub only evaluates `schedule.cron` from static
# workflow YAML on the default branch - it can never be sourced from a
# Repository Variable or config file. THIS repository owns its monitoring
# frequency/day/time/timezone by editing the `cron:` line below. Cron is
# always UTC; convert your local time before committing. Examples:
#   - Weekly, Mon 02:00 Australia/Brisbane (UTC+10, no DST) -> '0 16 * * 0' (Sun 16:00 UTC)
#   - Daily,  01:00 UTC                                     -> '0 1 * * *'
#   - Weekly, Sat 23:00 America/New_York (UTC-4/-5, DST-aware -> pick one offset
#     or use two cron lines for DST/non-DST periods)          -> '0 3 * * 6' (approx, UTC-5)
# To pause monitoring entirely without touching this file, set the
# BASE_IMAGE_MONITOR_ENABLED Repository Variable to "false" instead - the
# schedule still fires but the job exits immediately.
#
# Required repository configuration in the CONSUMER repo:
#   - Variables (Settings > Actions > Variables) - see the catalog in
#     docs/REUSABLE_AUTOMATION.md. Nothing is required; every variable has
#     a documented default. Common ones to set:
#       BASE_IMAGE_MONITOR_ENABLED, BASE_IMAGE_UPDATE_STRATEGY,
#       BASE_IMAGE_UPDATE_POLICY,
#       AUTO_CREATE_UPDATE_PR, AUTO_MERGE_UPDATE_PR,
#       REPOSITORY_REVIEWERS, REPOSITORY_ASSIGNEES,
#       DOCKERFILE_PATH, BUILD_CONTEXT, BUILD_PLATFORMS, TEST_COMMAND,
#       DEPLOYMENT_ENVIRONMENT, SCAN_SEVERITY_THRESHOLD, PATHS_IGNORE,
#       IMAGE_NAME, PUBLISH_GHCR, PUBLISH_DOCKERHUB, PUBLISH_ACR,
#       PUBLISH_ECR, GHCR_IMAGE, DOCKERHUB_IMAGE, ACR_IMAGE, ECR_IMAGE, ...
#   - Secrets: only for the registries you enable, e.g. DOCKERHUB_USERNAME/
#     DOCKERHUB_TOKEN for Docker Hub, ACR_USERNAME/ACR_PASSWORD for ACR,
#     AWS_ROLE_ARN for ECR (OIDC). GHCR publishing uses the automatic
#     GITHUB_TOKEN - no secret needed.
#   - Environment: the environment named by DEPLOYMENT_ENVIRONMENT (e.g.
#     "production"), with required reviewers configured under
#     Settings > Environments if you want an approval gate before publish.
#
# ADVANCED / OPTIONAL: a .github/docker-automation.yml file in this
# repository is still supported and is consulted for anything a Repository
# Variable does not already supply - primarily useful for multi-instance
# registry targets (e.g. two ACR instances) that a single scalar variable
# cannot express. See docs/docker-automation.yml.example.

name: Docker Image Release

on:
  # Consumer-owned schedule - see header comment above.
  schedule:
    - cron: '0 16 * * 0'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run mode"
        required: true
        type: choice
        options: ["true", "false"]
        default: "true"

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  # Entry point #1 in the lifecycle: scheduled monitoring. Only ever opens
  # a PR - it must never publish or release directly.
  monitor-base-image:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: your-org/docker-image-lifecycle/.github/workflows/reusable-base-image-monitor.yml@v1
    with:
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true' || false }}
      # Repository Variables are the primary configuration surface -
      # reusable workflows cannot read the caller's `vars` context
      # directly, so every variable used must be forwarded explicitly.
      var-monitor-enabled: ${{ vars.BASE_IMAGE_MONITOR_ENABLED }}
      var-update-strategy: ${{ vars.BASE_IMAGE_UPDATE_STRATEGY }}
      # Which signals decide an update. Default DIGEST_AND_VERSION also
      # catches same-tag rebuilds (security patches published without a
      # version bump), which tag comparison alone cannot see.
      var-update-policy: ${{ vars.BASE_IMAGE_UPDATE_POLICY }}
      var-auto-create-pr: ${{ vars.AUTO_CREATE_UPDATE_PR }}
      var-auto-merge: ${{ vars.AUTO_MERGE_UPDATE_PR }}
      var-reviewers: ${{ vars.REPOSITORY_REVIEWERS }}
      var-assignees: ${{ vars.REPOSITORY_ASSIGNEES }}
    secrets: inherit

  # Entry point #2: triggered ONLY by a push to the release branch, i.e.
  # only after a PR (human-authored or the monitor's automated PR) has been
  # reviewed, approved, and merged. This is the sole authoritative release
  # trigger - see docs/REUSABLE_AUTOMATION.md for why push is preferred over
  # pull_request.closed / workflow_run / repository_dispatch.
  release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    uses: your-org/docker-image-lifecycle/.github/workflows/reusable-docker-release.yml@v1
    with:
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true' || false }}
      var-dockerfile: ${{ vars.DOCKERFILE_PATH }}
      var-build-context: ${{ vars.BUILD_CONTEXT }}
      var-platforms: ${{ vars.BUILD_PLATFORMS }}
      var-test-command: ${{ vars.TEST_COMMAND }}
      var-environment: ${{ vars.DEPLOYMENT_ENVIRONMENT }}
      var-scan-severity-threshold: ${{ vars.SCAN_SEVERITY_THRESHOLD }}
      # Immutable release ID policy. An upstream tag can be published as an
      # optional alias, but it is not safe as the sole release identifier
      # when publishers rebuild the same tag with a new digest.
      var-release-tag-strategy: ${{ vars.RELEASE_TAG_STRATEGY }}
      var-release-prefix: ${{ vars.RELEASE_PREFIX }}
      var-release-increment-basename: ${{ vars.RELEASE_INCREMENT_BASENAME }}
      var-release-semver-initial: ${{ vars.RELEASE_SEMVER_INITIAL }}
      var-release-semver-bump: ${{ vars.RELEASE_SEMVER_BUMP }}
      var-publish-upstream-tag-alias: ${{ vars.PUBLISH_UPSTREAM_TAG_ALIAS }}
      var-sign-images: ${{ vars.SIGN_IMAGES }}
      var-paths-ignore: ${{ vars.PATHS_IGNORE }}
      var-image-name: ${{ vars.IMAGE_NAME }}
      var-publish-ghcr: ${{ vars.PUBLISH_GHCR }}
      var-ghcr-image: ${{ vars.GHCR_IMAGE }}
      var-publish-dockerhub: ${{ vars.PUBLISH_DOCKERHUB }}
      var-dockerhub-image: ${{ vars.DOCKERHUB_IMAGE }}
      var-publish-acr: ${{ vars.PUBLISH_ACR }}
      var-acr-image: ${{ vars.ACR_IMAGE }}
      var-publish-ecr: ${{ vars.PUBLISH_ECR }}
      var-ecr-image: ${{ vars.ECR_IMAGE }}
      var-aws-region: ${{ vars.AWS_REGION }}
      var-publish-quay: ${{ vars.PUBLISH_QUAY }}
      var-quay-image: ${{ vars.QUAY_IMAGE }}
      var-publish-harbor: ${{ vars.PUBLISH_HARBOR }}
      var-harbor-image: ${{ vars.HARBOR_IMAGE }}
      var-harbor-registry-host: ${{ vars.HARBOR_REGISTRY_HOST }}
      var-publish-artifactory: ${{ vars.PUBLISH_ARTIFACTORY }}
      var-artifactory-image: ${{ vars.ARTIFACTORY_IMAGE }}
      var-artifactory-registry-host: ${{ vars.ARTIFACTORY_REGISTRY_HOST }}
      var-publish-gitlab: ${{ vars.PUBLISH_GITLAB }}
      var-gitlab-image: ${{ vars.GITLAB_IMAGE }}
      var-gitlab-registry-host: ${{ vars.GITLAB_REGISTRY_HOST }}
      var-publish-digitalocean: ${{ vars.PUBLISH_DIGITALOCEAN }}
      var-digitalocean-image: ${{ vars.DIGITALOCEAN_IMAGE }}
      var-publish-ocir: ${{ vars.PUBLISH_OCIR }}
      var-ocir-image: ${{ vars.OCIR_IMAGE }}
      var-ocir-registry-host: ${{ vars.OCIR_REGISTRY_HOST }}
      var-publish-private: ${{ vars.PUBLISH_PRIVATE }}
      var-private-image: ${{ vars.PRIVATE_IMAGE }}
      var-private-registry-host: ${{ vars.PRIVATE_REGISTRY_HOST }}
    secrets: inherit
